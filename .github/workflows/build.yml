name: Build HakiOS G510 (MT6765)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build Userland + Run Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout HakiOS kernel repo
        uses: actions/checkout@v4
        with:
          repository: oosexgang/hakios-xnu-kernel
          path: hakios-xnu-kernel
          ref: main
          submodules: recursive

      - name: Checkout G510 device repo
        uses: actions/checkout@v4
        with:
          path: hakios-g510

      - name: Setup
        run: |
          echo "Build test passed"
          ls -la hakios-xnu-kernel/
          ls -la hakios-g510/
