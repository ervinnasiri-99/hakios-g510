name: Build HakiOS G510

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout HakiOS kernel
        uses: actions/checkout@v4
        with:
          repository: oosexgang/hakios-xnu-kernel
          path: hakios-xnu-kernel
          ref: main
          submodules: recursive

      - name: Checkout G510 device
        uses: actions/checkout@v4
        with:
          path: hakios-g510

      - name: Setup
        run: |
          echo "Setup done"
          ls -la hakios-xnu-kernel/
          ls -la hakios-g510/
