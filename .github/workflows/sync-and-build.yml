name: Sync G510 and Build (run in hakios-xnu-kernel repo)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-and-build.yml'

jobs:
  sync-and-build:
    name: Sync G510 device and build
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout hakios-xnu-kernel
        uses: actions/checkout@v4
        with:
          repository: oosexgang/hakios-xnu-kernel
          token: ${{ secrets.GITHUB_TOKEN }}
          path: hakios-xnu-kernel
          submodules: recursive

      - name: Checkout hakios-g510
        uses: actions/checkout@v4
        with:
          repository: ervinnasiri-99/hakios-g510
          token: ${{ secrets.GITHUB_TOKEN }}
          path: hakios-g510

      - name: Sync G510 to devices/g510
        run: |
          cd hakios-xnu-kernel
          python3 tools/hakios-device.py sync g510

      - name: Install dependencies
        run: |
          brew install bash blacktop/tap/ipsw cmake ninja coreutils gnu-sed gawk
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> $GITHUB_PATH

- name: Verify SDK
        run: |
          xcodebuild -showsdks
          ls -la $(xcrun --show-sdk-path)/System/Library/Frameworks/ | head -20

      - name: Setup Xcode
        run: |
          # Use default Xcode

      - name: Setup build deps (cctools, SDK, theos)
        run: |
          cd ${GITHUB_WORKSPACE}/hakios-xnu-kernel
          ./xnu-deps/setup.sh

      - name: Apply XNU patches
        run: |
          cd ${GITHUB_WORKSPACE}/hakios-xnu-kernel
          ./xnu/apply.sh

      - name: Build ath11k Wi-Fi object (for REDWOOD_OBJECTS)
        run: |
          cd ${GITHUB_WORKSPACE}/hakios-xnu-kernel
          ./tools/mk-ath11k.sh

      - name: Build kernel
        run: |
          cd ${GITHUB_WORKSPACE}/hakios-xnu-kernel
          source xnu-env.sh
          ./xnu-build.sh -j$(sysctl -n hw.ncpu) -k 2>&1 | tee build.log
        continue-on-error: true
      - name: Check build log on failure
        if: failure()
        run: |
          tail -100 build.log

      - name: Fetch IPSW (iOS 16.5 20F66)
        run: |
          cd ${GITHUB_WORKSPACE}/hakios-xnu-kernel
          ./ios165/fetch.sh
        env:
          IPSW_URL: https://updates.cdn-apple.com/2023SummerFCS/fullrestores/042-07939/3E8D0B5C-1C2E-4E8B-9F8C-3D8E9F1A2B4C/iPhone_4.0_64bit_16.5_20F66_Restore.ipsw

      - name: Build userland
        run: |
          cd ${GITHUB_WORKSPACE}/hakios-xnu-kernel
          ./userland/build.sh

      - name: Pull firmware from device
        run: |
          cd ${GITHUB_WORKSPACE}/hakios-g510
          ./pull-firmware.sh
        env:
          HAKIOS_SERIAL: ${{ secrets.HAKIOS_SERIAL }}

      - name: Build boot image and run test
        run: |
          cd ${GITHUB_WORKSPACE}/hakios-g510
          XNU_SECS=120 XNU_ARGS="cpus=8 touchscreen=1 buttons=2 mtk_cpufreq=3 emmc_root=1 connsys_step=11" \
            tools/xnu-cycle.sh
        env:
          HAKIOS_SERIAL: ${{ secrets.HAKIOS_SERIAL }}

      - name: Upload logs and artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hakios-g510-results
          path: |
            hakios-g510/logs/
            hakios-g510/xnu-flashed-slot_a.img
            hakios-xnu-kernel/hakios-kernel
            hakios-xnu-kernel/userland/system.apfs
          retention-days: 30