# drivers/input/conf: the touch screen, the event queue behind /dev/hakios-touch, the buttons.
# CONFIG_HAKIOS_<NAME>=y in a defconfig builds a driver into the kernel; "standard" files are always built.
# tools/hakios-config.py reads this file; docs/drivers-config.md says what each word means and how it reaches XNU.

standard bsd/dev/g510_tcm.c
	help    the touch controller, the event queue behind /dev/hakios-touch

driver MTKKEYS
	file    bsd/dev/g510_mtkkeys.c
	help    the power and volume keys, read from the PMIC through the SPMI arbiter (buttons=2)

driver MTKSCP
	file    bsd/dev/g510_mtk_scp.c
	help    the SCP sensor hub: accelerometer, kern.g510.accel (sensors=1)