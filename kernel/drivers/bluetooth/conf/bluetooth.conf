# drivers/bluetooth/conf: the Bluetooth drivers.
# CONFIG_HAKIOS_<NAME>=y in a defconfig builds a driver into the kernel; "standard" files are always built.
# tools/hakios-config.py reads this file; docs/drivers-config.md says what each word means and how it reaches XNU.

driver MTKBT
	file    bsd/dev/g510_mtkbt.c
	help    the Bluetooth transport (HCI over STP ch0 via BTIF): mtkbt_platform for the skeleton; function on/off, H4 send/receive
	help    (mtkbt_skel=1)