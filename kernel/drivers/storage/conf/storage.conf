# drivers/storage/conf: the phone's flash (eMMC), the sparse and image devices, the checks of the APFS read path.
# CONFIG_HAKIOS_<NAME>=y in a defconfig builds a driver into the kernel; "standard" files are always built.
# tools/hakios-config.py reads this file; docs/drivers-config.md says what each word means and how it reaches XNU.

standard bsd/dev/g510_emmc.c
	help    the eMMC's xnusys partition as a read-only block device and the root (emmc_root=1)

driver MTKEMMC
	file    bsd/dev/g510_emmc.c
	help    the eMMC driver for the xnusys partition