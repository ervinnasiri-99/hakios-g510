# devices/g510/device.conf: the phone, for the common repository's device tooling (tools/hakios-device.py; the same
# words as hakios-sm7325's device.conf). Its SoC's layer is the common repository's socs/mt6765/.
device g510
	title	General Mobile GM 21 Plus (G510)
	vendor	General Mobile
	soc	mt6765
	defconfig	g510_defconfig
	firmware	pull-firmware.sh
	maintainer	the HakiOS developers (README.md)
	status display works 720x1600, scale 2 (fbscale=2 fbfit=3)
	status touch works Novatek NT36525 over SPI0 (touchscreen=1)
	status buttons works power and volume, keypad at 0x10010000 (buttons=1)
	status cpu works 8 cores, big cores clocked (cpus=8 mtk_cpufreq=3)
	status gpu missing PowerVR GE8320 — fb-only for now (pvr=1)
	status storage partial the system image read off the eMMC, read only (emmc_root=1)
	status sensors missing accelerometer through the SCP sensor hub
	status wifi partial CONNSYS up, WMT channel over BTIF/STP; no network yet
	status bluetooth partial CONNSYS up (connsys_step=11), BTIF/STP ready; skeleton waiting for mtkbt_skel=1; no function_on, pairing, profiles or audio yet
	status audio missing
	status battery missing
	status haptic missing
	status camera missing
	status torch missing
	status cellular missing
	status thermal missing